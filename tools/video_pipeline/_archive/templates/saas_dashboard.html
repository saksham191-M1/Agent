<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { margin:0; padding:0; background: #f0f2f5; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
  
  /* The App Mockup */
  .app { width: 400px; height: 800px; background: #ffffff; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); position: relative; overflow: hidden; display: flex; flex-direction: column; }
  
  /* Header */
  .header { padding: 40px 30px 30px; background: linear-gradient(135deg, {{BRAND_COLOR}} 0%, #000000 100%); color: white; border-radius: 0 0 30px 30px; }
  .header h1 { margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -1px; }
  .header p { margin: 5px 0 0; opacity: 0.8; font-size: 16px; }
  
  /* Content */
  .content { padding: 30px; flex: 1; display: flex; flex-direction: column; gap: 20px; }
  
  /* Beautiful Glass Cards */
  .card { background: white; border: 1px solid #edf2f7; border-radius: 20px; padding: 25px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
  .card-title { font-weight: 600; font-size: 18px; color: #1a202c; margin-bottom: 15px; }
  .skeleton-line { height: 10px; background: #edf2f7; border-radius: 5px; margin-bottom: 12px; width: 100%; }
  .skeleton-line.short { width: 60%; }
  
  /* Chart Simulation */
  .chart { height: 120px; width: 100%; background: linear-gradient(180deg, rgba({{BRAND_COLOR_RGB}}, 0.15) 0%, rgba(255,255,255,0) 100%); border-bottom: 3px solid {{BRAND_COLOR}}; margin-top: 15px; border-radius: 8px 8px 0 0; position: relative;}
  
  /* The Button */
  .btn-container { padding: 20px 30px 40px; }
  .btn { width: 100%; padding: 20px; background: {{BRAND_COLOR}}; color: white; border: none; border-radius: 18px; font-size: 20px; font-weight: 600; cursor: pointer; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 20px -5px rgba({{BRAND_COLOR_RGB}}, 0.5); display: flex; justify-content: center; align-items: center;}
  
  /* Button Click Animation */
  .btn.clicked { transform: scale(0.96); box-shadow: 0 0 0 rgba({{BRAND_COLOR_RGB}}, 0); }
  .btn.clicked::after { content: '✓ Success'; position: absolute; background: #10B981; width: 100%; height: 100%; border-radius: 18px; display: flex; align-items: center; justify-content: center; top: 0; left: 0; font-weight: 700;}
  
  /* Cursor Animation */
  .cursor { width: 32px; height: 32px; position: absolute; top: 100%; left: 80%; background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"><path fill="%23111" stroke="white" stroke-width="2" d="M7 2l12 11.2-5.8.5 3.3 7.3-2.2 1-3.2-7.4-4.4 4.8z"/></svg>') no-repeat; z-index: 100; animation: moveCursor 4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));}
  
  @keyframes moveCursor {
    0% { top: 100%; left: 80%; }
    40% { top: 705px; left: 50%; }
    60% { top: 705px; left: 50%; transform: scale(0.9); } /* Click */
    70% { top: 705px; left: 50%; transform: scale(1); }
    100% { top: 705px; left: 50%; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>{{APP_NAME}}</h1>
      <p>Welcome back</p>
    </div>
    
    <div class="content">
      <div class="card">
        <div class="card-title">Performance Overview</div>
        <div class="chart"></div>
      </div>
      
      <div class="card">
        <div class="card-title">Recent Activity</div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line"></div>
        <div class="skeleton-line short"></div>
      </div>
    </div>
    
    <div class="btn-container">
      <button class="btn" id="actionBtn" style="position: relative;">{{PRIMARY_ACTION}}</button>
    </div>
    
    <div class="cursor"></div>
  </div>
  
  <script>
    setTimeout(() => {
      document.getElementById('actionBtn').classList.add('clicked');
    }, 2400); // Syncs with 60% of 4s animation
  </script>
</body>
</html>
